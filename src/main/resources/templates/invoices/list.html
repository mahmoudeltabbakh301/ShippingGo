<!DOCTYPE html>
<html th:lang="${#locale.language}" th:dir="${#locale.language == 'ar' ? 'rtl' : 'ltr'}"
    xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الفواتير - ShippingGo</title>
    
    <script>
        (function () {
            var theme = localStorage.getItem('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/components/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet" th:href="@{/css/components/tables.css}">
    <link rel="stylesheet" th:href="@{/css/components/cards.css}">
    <style>
        .business-day-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: var(--space-4);
        }
        .bd-card {
            background: var(--dark-surface);
            border: 1px solid var(--dark-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .bd-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.25);
            border-color: var(--accent-1);
        }
        .bd-card-header {
            padding: var(--space-4);
            background: linear-gradient(135deg, var(--dark-surface), var(--dark-bg));
            border-bottom: 2px solid var(--accent-1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .bd-card-title {
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }
        .bd-card-date {
            color: var(--text-tertiary);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .bd-card-body {
            padding: var(--space-4);
        }
        .bd-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-3);
            margin-bottom: var(--space-4);
        }
        .bd-stat {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: var(--space-3);
            border-radius: var(--radius-md);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--dark-border);
        }
        .bd-stat-label {
            font-size: 0.78rem;
            color: var(--text-tertiary);
        }
        .bd-stat-value {
            font-weight: 700;
            font-size: 1.2rem;
        }
        .bd-stat-value.count {
            color: var(--accent-1);
        }
        .bd-stat-value.amount {
            color: #10b981;
        }
        .bd-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 600;
        }
        .bd-status-active {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }
        .bd-status-closed {
            background: rgba(107, 114, 128, 0.15);
            color: #9ca3af;
        }
        .bd-card-footer {
            padding: var(--space-3) var(--space-4);
            border-top: 1px solid var(--dark-border);
            display: flex;
            justify-content: center;
        }
        .bd-card-footer .btn {
            width: 100%;
            justify-content: center;
        }
    </style>
    <script th:src="@{/js/lucide.min.js}"></script>
</head>

<body>
    <div class="app-layout">
        <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

        <main class="main-content">
            <div class="page-header">
                <h1 class="page-title"><i data-lucide="file-text" class="inline-icon"></i> إدارة الفواتير</h1>
                <p style="color: var(--text-tertiary); margin-top: var(--space-1);">
                    اختر يوم عمل لعرض الفواتير الخاصة به
                </p>
            </div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <!-- عرض أيام العمل كبطاقات -->
            <th:block th:if="${summaries != null && !summaries.isEmpty()}">
                <div class="business-day-cards">
                    <div th:each="summary : ${summaries}" class="bd-card">
                        <div class="bd-card-header">
                            <div class="bd-card-title">
                                <i data-lucide="calendar-days" class="inline-icon"></i> <span th:text="${summary.businessDayName}">يوم العمل</span>
                            </div>
                            <div style="display: flex; align-items: center; gap: var(--space-2);">
                                <span th:if="${summary.active}" class="bd-status-badge bd-status-active"><i data-lucide="circle-dot" class="inline-icon"></i> مفتوح</span>
                                <span th:unless="${summary.active}" class="bd-status-badge bd-status-closed"><i data-lucide="circle" class="inline-icon"></i> مُغلق</span>
                            </div>
                        </div>
                        <div class="bd-card-body">
                            <div class="bd-card-date" style="margin-bottom: var(--space-3);">
                                <i data-lucide="calendar" class="inline-icon"></i> <span th:text="${#temporals.format(summary.date, 'dd/MM/yyyy')}">01/01/2026</span>
                            </div>
                            <div class="bd-stats">
                                <div class="bd-stat">
                                    <span class="bd-stat-label">عدد الفواتير</span>
                                    <span class="bd-stat-value count" th:text="${summary.invoiceCount}">0</span>
                                </div>
                                <div class="bd-stat">
                                    <span class="bd-stat-label">إجمالي المبالغ</span>
                                    <span class="bd-stat-value amount" th:text="${summary.totalAmount} + ' ج.م'">0 ج.م</span>
                                </div>
                            </div>
                        </div>
                        <div class="bd-card-footer">
                            <a th:href="@{/invoices/day/{id}(id=${summary.businessDayId})}" class="btn btn-primary">
                                <i data-lucide="clipboard-list" class="inline-icon"></i> عرض التفاصيل
                            </a>
                        </div>
                    </div>
                </div>
            </th:block>

            <div th:if="${summaries == null || summaries.isEmpty()}" 
                 class="card" style="text-align: center; padding: var(--space-8);">
                <div style="font-size: 3rem; margin-bottom: var(--space-4);"><i data-lucide="file-text"></i></div>
                <p style="color: var(--text-tertiary);">لا توجد فواتير حالياً. قم بإنشاء فواتير من داخل صفحة يوم العمل.</p>
                <a th:href="@{/business-days}" class="btn btn-primary" style="margin-top: var(--space-4);">
                    <i data-lucide="calendar-days" class="inline-icon"></i> الذهاب لأيام العمل
                </a>
            </div>

        </main>
    </div>

    <button class="mobile-menu-toggle" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
    <script th:src="@{/js/sidebar.js}"></script>
    <script>document.addEventListener("DOMContentLoaded",function(){if(typeof lucide!=="undefined"){lucide.createIcons();}});</script>
</body>

</html>
